services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taniguard}
      MYSQL_USER: ${MYSQL_USER:-taniguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taniguard}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-taniguard}:${MYSQL_PASSWORD:-taniguard}@mysql:3306/${MYSQL_DATABASE:-taniguard}?charset=utf8mb4}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONFIG_DIR: /srv/config
      LOCAL_STORAGE_DIR: /srv/data/uploads
      MODEL_DIR: /srv/ml/weights
    volumes:
      - uploads:/srv/data
      - ./ml/weights:/srv/ml/weights
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

  # Local MQTT path (Phase 10): docker compose --profile iot up
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["iot"]
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"

  mqtt-bridge:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["iot"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://${MYSQL_USER:-taniguard}:${MYSQL_PASSWORD:-taniguard}@mysql:3306/${MYSQL_DATABASE:-taniguard}?charset=utf8mb4}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CONFIG_DIR: /srv/config
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    command: ["flask", "mqtt-bridge"]
    restart: unless-stopped
    depends_on:
      - backend
      - mosquitto

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
  uploads:
