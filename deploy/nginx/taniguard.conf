# Nginx site for the non-Docker setup (deploy/systemd/taniguard-api.service).
#   sudo cp deploy/nginx/taniguard.conf /etc/nginx/sites-available/taniguard
#   sudo ln -s /etc/nginx/sites-available/taniguard /etc/nginx/sites-enabled/ && sudo nginx -s reload
server {
  listen 80;
  server_name _;
  client_max_body_size 12m;
  root /opt/taniguard/frontend/dist;
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri /index.html;
  }
}
